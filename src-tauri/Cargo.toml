[package]
name = "sightdeck"
version = "0.2.7"
edition = "2021"
description = "Desktop client for the pi coding agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.21"
serde_json = "1"
portable-pty = "0.9"
# Só entram no binário E2E (`--features e2e`): produção não abre o WebDriver.
tauri-plugin-wdio = { version = "2.0.0-next.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "2.0.0-next.0", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.dev]
opt-level = 0
